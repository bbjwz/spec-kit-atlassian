[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "spec-kit-atlassian"
version = "0.2.0"
description = "Deterministic Spec Kit publishing for Jira and Confluence Cloud"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["httpx>=0.28,<1", "pydantic>=2.10,<3", "PyYAML>=6,<7", "markdown-it-py>=3,<5", "lxml>=5,<7"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-cov>=6,<8", "ruff>=0.11,<1", "mypy>=1.15,<2", "types-PyYAML", "lxml-stubs"]

[project.scripts]
spec-kit-atlassian = "spec_kit_atlassian.cli:main"
spec-kit-atlassian-project-worker = "spec_kit_atlassian.governance.worker:main"
spec-kit-atlassian-worker = "spec_kit_atlassian.common.worker:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
files = ["src"]
check_untyped_defs = true
ignore_missing_imports = true

[tool.hatch.build.targets.wheel]
packages = ["src/spec_kit_atlassian"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/README.md", "/LICENSE", "/pyproject.toml", "/uv.lock"]
