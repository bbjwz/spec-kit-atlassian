name: CI
on:
  pull_request:
  push:
    branches: [main, 'codex/**']
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        python: ['3.11', '3.14']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          enable-cache: true
      - run: uv sync --extra test --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src
      - run: uv run python -m pytest --cov --cov-report=term-missing
      - run: uv build
      - run: uv run python scripts/build_release.py
  install:
    strategy:
      matrix:
        speckit: ['1.0.8', '1.0.10']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
      - run: uv sync --extra test --locked
      - run: bash scripts/verify_install.sh
        env:
          SPEC_KIT_VERSION: ${{ matrix.speckit }}
